[project]
name = "agentic-analyst"
version = "0.1.0"
description = "Агент-аналитик над e-commerce данными: RAG + SQL, с измеренными компромиссами"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
    "pydantic>=2.8",
]

[project.optional-dependencies]
trace = ["langfuse>=2.50"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
